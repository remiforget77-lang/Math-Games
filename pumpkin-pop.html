<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pumpkin Pop</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0b0714; height:100%;
    font-family:'Segoe UI', system-ui, sans-serif; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; color:#fff; }
  .panel { position:absolute; background:rgba(20,10,35,.78); border:1px solid rgba(255,150,50,.35);
    border-radius:12px; padding:10px 14px; }
  #stats { top:12px; left:12px; font-size:16px; line-height:1.6; min-width:150px; }
  #stats b { color:#ffb347; }
  #tag { top:12px; left:50%; transform:translateX(-50%); font-size:18px; font-weight:700; color:#ffd34d; }
  #toast { position:absolute; top:14%; left:50%; transform:translateX(-50%);
    font-size:34px; font-weight:900; text-shadow:0 3px 10px rgba(0,0,0,.8); opacity:0; transition:opacity .25s; }
  #help { bottom:12px; left:50%; transform:translateX(-50%); font-size:14px; color:#d8c8ff; white-space:nowrap; }
  #help b { color:#ffb347; }
  #catbubble { position:absolute; bottom:170px; right:26px; background:#fff; color:#111;
    font-weight:800; font-size:18px; padding:8px 14px; border-radius:14px; display:none; }
  #menu { position:fixed; inset:0; background:radial-gradient(ellipse at 50% 30%, #2a1650 0%, #0b0714 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; z-index:10; }
  #menu h1 { font-size:44px; margin:0 0 6px; color:#ff9800; }
  #menu h2 { font-size:18px; font-weight:600; color:#d8c8ff; margin:0 0 22px; }
  #tableGrid { display:grid; grid-template-columns:repeat(4, 84px); gap:12px; margin-bottom:18px; }
  #tableGrid button { font-size:26px; font-weight:900; padding:16px 0; background:#3a1d6e;
    border:2px solid #ff9800; border-radius:12px; color:#ffd34d; cursor:pointer; }
  #mixedBtn { font-size:20px; font-weight:900; padding:14px 34px; margin-bottom:14px; background:#6d4aff;
    border:2px solid #b39dff; border-radius:12px; color:#fff; cursor:pointer; }
  #langBtn { font-size:16px; font-weight:800; padding:8px 18px; margin-bottom:20px; background:#241540;
    border:2px solid #6d4aff; border-radius:12px; color:#d8c8ff; cursor:pointer; }
  #hudLang { position:absolute; top:12px; right:12px; font-size:13px; font-weight:700; padding:6px 12px;
    background:rgba(20,10,35,.78); border:1px solid rgba(255,150,50,.35); border-radius:10px;
    color:#d8c8ff; cursor:pointer; pointer-events:auto; font-family:inherit; }
  #howto { font-size:14px; color:#b9a8e8; max-width:620px; text-align:center; line-height:1.65; padding:0 20px; }
  #howto b { color:#ffb347; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="panel" id="stats">
    <div id="candy">Candy <b id="candyN">0</b></div>
    <div><span id="lScore">Popped</span> <b id="score">0</b></div>
    <div><span id="lGiant">Giant</span> <b id="giantN">0</b>/5</div>
  </div>
  <div class="panel" id="tag"></div>
  <button id="hudLang">FR</button>
  <div id="toast"></div>
  <div id="catbubble"></div>
  <div class="panel" id="help"><span id="lHelp"></span></div>
</div>
<div id="menu">
  <h1>Pumpkin Pop</h1>
  <h2 id="mSub"></h2>
  <div id="tableGrid"></div>
  <button id="mixedBtn"></button>
  <div style="display:flex;gap:12px;margin-bottom:14px;">
    <button id="modeHit" style="font-size:16px;padding:10px 20px;"></button>
    <button id="modeQuiz" style="font-size:16px;padding:10px 20px;"></button>
  </div>
  <button id="langBtn"></button>
  <div id="howto"></div>
</div>
<script>
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W=0, H=0;
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();
const $ = id => document.getElementById(id);
const hud = { candyN:$('candyN'), score:$('score'), giantN:$('giantN'), tag:$('tag'), toast:$('toast'), bubble:$('catbubble') };

const I18N = {
  en: {
    mSub: 'Calm multiplication practice - pick a table:',
    mixed: 'Mixed tables (2-9)',
    howto: 'One big number floats in the sky, like <b>15</b> with <b>3 x ?</b> under it. Press <b>SPACE</b> - each hit removes one pumpkin group. Hit <b>5 times</b> and it pops: <b>+1 candy</b>. Collect <b>5 candies</b> to burst the giant pumpkin. Or use Quiz mode and type the missing number.',
    tagMixed: 'Mixed tables 2-9', tagTable: t => 'Practicing x' + t,
    lScore: 'Popped', lGiant: 'Giant',
    lHelp: 'Press <b>SPACE</b> - one pumpkin per hit',
    lHelpQuiz: 'Type the missing number <b>2-9</b>',
    targetLabel: (t,r)=> t + ' x ' + r + ' =',
    hitN: (t,h)=> t + ' x ' + h + ' so far...',
    poppedMsg: (t,f,r)=> t + ' x ' + f + ' = ' + r + '! +1 candy',
    burst: 'THE GREAT PUMPKIN BURSTS!',
    meow: 'Miau!', laugh: 'Mwahaha!',
    catMade: n => 'I made ' + n + '!',
    catBuilt: b => 'Look, I built a ' + b + '!',
    bPumpkin: 'candy pumpkin', bGhost: 'ghost', bCane: 'candy cane', bHat: 'witch hat',
    modeHit: 'Hit mode (SPACE x5)', modeQuiz: 'Quiz mode (pick the number)',
    quizPrompt: (t,r)=> t + ' x ? = ' + (r*t),
    quizRight: (t,f,r)=> t + ' x ' + f + ' = ' + r + '! +1 candy',
    quizWrong: (t,f,r)=> t + ' x ? = ' + r + ' - answer was ' + f,
    hudLang: 'FR', menuLang: 'English'
  },
  fr: {
    mSub: 'Pratique calme des multiplications - choisis une table :',
    mixed: 'Tables melangees (2-9)',
    howto: 'Un grand nombre flotte dans le ciel, comme <b>15</b> avec <b>3 x ?</b> dessous. Appuie sur <b>ESPACE</b> - chaque touche enleve un groupe de citrouilles. Touche <b>5 fois</b> et ca eclate : <b>+1 bonbon</b>. Ramasse <b>5 bonbons</b> pour faire éclater la citrouille geante. Ou mode quiz : tape le nombre manquant.',
    tagMixed: 'Tables melangees 2-9', tagTable: t => 'On pratique x' + t,
    lScore: 'Eclatees', lGiant: 'Citrouille',
    lHelp: 'Appuie sur <b>ESPACE</b> - une citrouille par touche',
    lHelpQuiz: 'Tape le nombre manquant <b>2-9</b>',
    targetLabel: (t,r)=> t + ' x ' + r + ' =',
    hitN: (t,h)=> t + ' x ' + h + " pour l'instant...",
    poppedMsg: (t,f,r)=> t + ' x ' + f + ' = ' + r + ' ! +1 bonbon',
    burst: 'LA GRANDE CITROUILLE EXPLOSE !',
    meow: 'Miaou !', laugh: 'Mwahaha !',
    catMade: n => "J'ai fait " + n + ' !',
    catBuilt: b => 'Regarde, j\'ai fabrique ' + b + ' !',
    bPumpkin: 'citrouille en bonbons', bGhost: 'fantome', bCane: "sucre d'orge", bHat: 'chapeau de sorciere',
    modeHit: 'Mode touches (ESPACE x5)', modeQuiz: 'Mode quiz (choisis le nombre)',
    quizPrompt: (t,r)=> t + ' x ? = ' + (r*t),
    quizRight: (t,f,r)=> t + ' x ' + f + ' = ' + r + ' ! +1 bonbon',
    quizWrong: (t,f,r)=> t + ' x ? = ' + r + ' - la reponse etait ' + f,
    hudLang: 'EN', menuLang: 'English'
  }
};
let lang='en', mode='hit', tableNum=5;
let candy=0, poppedCount=0, state='menu', elapsed=0, throwCd=0, respawnT=0;
function applyLang(){
  const L=I18N[lang];
  $('mSub').textContent=L.mSub; $('mixedBtn').textContent=L.mixed; $('howto').innerHTML=L.howto;
  $('lScore').textContent=L.lScore; $('lGiant').textContent=L.lGiant;
  $('hudLang').textContent=L.hudLang; $('langBtn').textContent=L.menuLang;
  $('modeHit').textContent=L.modeHit; $('modeQuiz').textContent=L.modeQuiz;
  $('lHelp').innerHTML = mode==='quiz' ? L.lHelpQuiz : L.lHelp;
  hud.tag.textContent = tableNum==='mixed' ? L.tagMixed : L.tagTable(tableNum);
}
$('langBtn').onclick=()=>{ lang = lang==='en'?'fr':'en'; applyLang(); };
$('hudLang').onclick=()=>{ lang = lang==='en'?'fr':'en'; applyLang(); };
$('modeHit').onclick=()=>{ mode='hit'; applyLang(); };
$('modeQuiz').onclick=()=>{ mode='quiz'; applyLang(); };

let AC=null;
function ac(){ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function tone(freq,dur,type,vol,slide,delay){
  try{
    const a=ac(), t0=a.currentTime+(delay||0);
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+dur);
    g.gain.setValueAtTime(vol||.12,t0);
    g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur);
  }catch(e){}
}
const sfx={
   meow(){ tone(620,.16,'sine',.13,880); tone(880,.3,'sine',.13,520,.16); },
  laugh(){ [660,520,440,330].forEach((f,i)=>tone(f,.14,'square',.09,i*.11)); },
  pop(){ tone(300,.1,'triangle',.15,900); },
  whoosh(){ tone(500,.15,'sine',.07,1200); },
  jingle(){ [[523,.22],[659,.22],[784,.22],[1047,.45],[784,.22],[659,.22],[880,.5]].forEach((n,i)=>tone(n[0],n[1],'triangle',.12,null,i*.24)); },
  boom(){ tone(90,1.0,'sawtooth',.16,40); }
};
let musicTimer=null;
nconst MELODY=[[392,1],[440,1],[523.25,2],[440,1],[392,1],[329.63,2],[349.23,1],[440,1],[523.25,2],[587.33,1],[523.25,1],[440,2],[392,1],[440,1],[523.25,2],[659.25,1],[587.33,1],[523.25,2],[440,1],[392,1],[329.63,2],[261.63,2],[0,2]];
function startMusic(){
  let step=0; const beat=.34; let nextT=ac().currentTime+.1;
  musicTimer=setInterval(()=>{
    const a=ac();
    while(nextT<a.currentTime+.5){
      const m=MELODY[step%MELODY.length];
      if(m[0]>0) toneAt(a,nextT,m[0],beat*m[1]*.95,'triangle',.05);
      nextT+=beat*m[1]; step++;
    }
  },120);
}
function toneAt(a,t0,f,d,type,vol){ const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+d); o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d); }

const target={ active:false, x:0, y:0, table:5, factor:0, hits:0, bob:0 };
const puffs=[], flights=[], boomPuffs=[], partyGhosts=[];
nconst giant={ x:0, y:0, r:64, candy:0, pulse:0, exploding:0 };
const cannon={ x:0, y:0, recoil:0 };
const cat={ mode:'idle', t:0, loot:0, buildT:6, build:null };
const NEEDED_HITS=5;
function nextTarget(){
  0;
  const t = tableNum==='mixed' ? 2+((Math.random()*8)|0) : tableNum;
  const f = 2+((Math.random()*8)|0);
  target.active=true; target.table=t; target.factor=f; target.hits=0;
  target.x=W/2; target.y=H*0.38; target.bob=Math.random()*6;
}
function burstGiant(){
  giant.exploding=.9;
  sfx.boom(); sfx.jingle();
  toast(I18N[lang].burst,'#ffd34d');
  for(let k=0;k<40;k++){
    const a=Math.random()*Math.PI*2, sp=120+Math.random()*320;
    boomPuffs.push({x:giant.x,y:giant.y,t:0,life:.9+Math.random()*.8,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-160,r:3+Math.random()*5});
  }
  for(let k=0;k<9;k++) partyGhosts.push({x:giant.x,y:giant.y,vx:(Math.random()-.5)*260,vy:-120-Math.random()*160,bob:Math.random()*6,t:0,life:4.5});
}
nfunction catSay(text,md){
  cat.mode=md; cat.t=0;
  hud.bubble.textContent=text; hud.bubble.style.display='block';
  if(md==='happy') sfx.meow(); else sfx.laugh();\n}
nfunction toast(msg,color){
  hud.toast.textContent=msg; hud.toast.style.color=color||'#ffb347';\n  hud.toast.style.opacity=1; clearTimeout(toast._t);
n  toast._t=setTimeout(()=>hud.toast.style.opacity=0,1200);\n}
window.addEventListener('keydown', e=>{
  if(state!=='play') return;
  if(mode==='quiz' && /^[2-9]$/.test(e.key)){ e.preventDefault(); answerQuiz(parseInt(e.key,10)); }
n  else if(e.key===' ' && mode==='hit'){ e.preventDefault(); hitOnce(); }\n});\nfunction hitOnce(){\n  if(throwCd>0 || !target.active) return;\n  throwCd=.25; cannon.recoil=1; sfx.whoosh();\n  const t=target; t.hits++;\n  burstPuffs(t.x,t.y,'#ffb347');\n  if(t.hits>=NEEDED_HITS){ popTarget(); }\n  else { toast(I18N[lang].hitN(t.table,t.hits),'#ffd34d'); sfx.pop(); }\n}\nfunction answerQuiz(num){\n  if(throwCd>0 || !target.active) return;\n  throwCd=.4; cannon.recoil=1;\n  const t=target;\n  if(num===t.factor){ popTarget(); }\n  else {\n    toast(I18N[lang].quizWrong(t.table,t.factor,t.factor*t.table),'#ff7b7b');\n    catSay(I18N[lang].laugh,'steal');\n    const stolen=Math.min(1,candy); candy-=stolen; cat.loot+=stolen;\n  }\n}\nfunction popTarget(){\n  const t=target;\n  poppedCount++; candy++;\n  toast(mode==='quiz' ? I18N[lang].quizRight(t.table,t.factor,t.factor*t.table) : I18N[lang].poppedMsg(t.table,t.factor,t.factor*t.table),'#7dff8a');\n  catSay(I18N[lang].meow,'happy');\n  sfx.pop();\n  giant.candy++; giant.pulse=1;\n  flights.push({x:t.x,y:t.y,t:0,life:.8});\n  t.active=false; respawnT=1.0;\n  if(giant.candy>=5) burstGiant();\n}\nfunction burstPuffs(x,y,color){\n  for(let k=0;k<12;k++) puffs.push({x:x+(Math.random()-.5)*80,y:y+(Math.random()-.5)*80,t:0,life:.5,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220-40,color});\n}\nconst grid=$('tableGrid');\nfor(let n=2;n<=9;n++){ const b=document.createElement('button'); b.textContent='x'+n; b.onclick=()=>startGame(n); grid.appendChild(b); }\n$('mixedBtn').onclick=()=>startGame('mixed');\nfunction startGame(t){\n  tableNum=t; $('menu').style.display='none';\n  try{ ac(); startMusic(); }catch(e){}\n  state='play'; elapsed=0; candy=0; poppedCount=0; throwCd=0; respawnT=0;\n  cat.loot=0; cat.build=null; cat.buildT=6;\n  giant.candy=0; giant.exploding=0; giant.pulse=0;\n  puffs.length=0; flights.length=0; boomPuffs.length=0; partyGhosts.length=0;\n  hud.candyN.textContent='0'; hud.score.textContent='0'; hud.giantN.textContent='0';\n  applyLang(); nextTarget();\n}\nconst deco=[];\nfor(let i=0;i<14;i++) deco.push({ x:Math.random()*2400, y:H*0.74+Math.random()*H*0.22,\n  kind:i%3===0?'tree':(i%3===1?'mushroom':'jack'), s:.8+Math.random()*.6, rot:Math.random()*6.28 });\nconst stars=[];\nfor(let i=0;i<110;i++) stars.push({x:Math.random()*4000, y:Math.random()*0.6, r:Math.random()<.15?2.4:1.4, tw:Math.random()*6.28});\nconst fogBlobs=[];\nfor(let i=0;i<8;i++) fogBlobs.push({x:Math.random()*2600, y:H*0.4+Math.random()*H*0.5, r:200+Math.random()*180, sp:8+Math.random()*12});\nfunction update(dt){\n  if(state!=='play') return;\n  elapsed+=dt; throwCd-=dt;\n  if(respawnT>0){ respawnT-=dt; if(respawnT<=0 && !target.active) nextTarget(); }\n  if(target.active) target.bob+=dt*1.2;\n  for(let i=puffs.length-1;i>=0;i--){ const p=puffs[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.t>p.life) puffs.splice(i,1); }\n  for(let i=flights.length-1;i>=0;i--){ const f=flights[i]; f.t+=dt; if(f.t>f.life) flights.splice(i,1); }\n  for(let i=boomPuffs.length-1;i>=0;i--){ const p=boomPuffs[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=420*dt; if(p.t>p.life) boomPuffs.splice(i,1); }\n  for(let i=partyGhosts.length-1;i>=0;i--){ const g=partyGhosts[i]; g.t+=dt; g.bob+=dt*3; g.x+=g.vx*dt; g.y+=g.vy*dt; g.vy+=60*dt; if(g.x<20||g.x>W-20) g.vx*=-1; if(g.t>g.life||g.y>H+80) partyGhosts.splice(i,1); }\n  for(const f of fogBlobs){ f.x+=f.sp*dt; if(f.x-f.r>W+100) f.x=-f.r; }\n  cannon.x=W/2; cannon.y=H-6; cannon.recoil=Math.max(0,cannon.recoil-dt*4);\n  giant.x=W-190; giant.y=H-120; giant.r=64+giant.pulse*10; giant.pulse=Math.max(0,giant.pulse-dt*3);\n  if(giant.exploding>0) giant.exploding-=dt;\n  cat.t+=dt;\n  if(cat.t>2.2 && cat.mode!=='idle'){ cat.mode='idle'; hud.bubble.style.display='none'; }\n  cat.buildT-=dt;\n  if(cat.buildT<=0){ cat.buildT=7+Math.random()*6; if(poppedCount>0){ cat.build = poppedCount%5===0?'pumpkin':'number'; catSay(I18N[lang].catMade(poppedCount),'happy'); } }\n  hud.score.textContent=poppedCount; hud.candyN.textContent=candy; hud.giantN.textContent=giant.candy;\n}\nfunction roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }\nfunction drawPumpkin(c,x,y,r){\n  c.fillStyle='#e07b00'; c.beginPath(); c.ellipse(x,y,r,r*.85,0,0,Math.PI*2); c.fill();\n  c.strokeStyle='rgba(120,50,0,.7)'; c.lineWidth=1.5;\n  c.beginPath(); c.ellipse(x,y,r*.55,r*.85,0,0,Math.PI*2); c.stroke();\n  c.fillStyle='#3d6b1e'; c.fillRect(x-2,y-r-5,4,7);\n}\nfunction drawTarget(c){\n  if(!target.active) return;\n  const x=target.x, y=target.y+Math.sin(target.bob)*10;\n  c.save(); c.translate(x,y);\n  c.fillStyle='rgba(20,10,35,.92)'; roundRect(c,-70,-52,140,104,20); c.fill();\n  c.strokeStyle='#ff9800'; c.lineWidth=3; c.stroke();\n  c.fillStyle='#ffd34d'; c.font='bold 52px sans-serif'; c.textAlign='center'; c.textBaseline='middle';\n  c.fillText(mode==='quiz' ? '?' : String(target.factor*target.table), 0, -12);\n  c.fillStyle='#d8c8ff'; c.font='bold 20px sans-serif';\n  c.fillText(mode==='quiz' ? I18N[lang].quizPrompt(target.table,target.factor) : I18N[lang].targetLabel(target.table,target.factor), 0, 28);\n  c.restore();\n  const rows=target.table, cols=target.factor, r=6, gap=16, remaining=cols-target.hits, gw=cols*gap;\n  c.save(); c.translate(x-gw/2+gap/2, y+72);\n  for(let i=0;i<rows*cols;i++){\n    const col=i%cols, row=(i/cols)|0, gone=col>=remaining;\n    c.globalAlpha = gone? .18 : 1;\n    c.fillStyle='#e07b00'; c.beginPath(); c.arc(col*gap,row*gap,r,0,Math.PI*2); c.fill();\n    c.strokeStyle='rgba(120,50,0,.8)'; c.lineWidth=1; c.stroke();\n  }\n  c.globalAlpha=1;\n  c.fillStyle='rgba(255,255,255,.75)'; c.font='bold 15px sans-serif'; c.textAlign='center';\n  c.fillText(target.hits + ' / ' + NEEDED_HITS, x, y+72+rows*gap+16);\n  c.restore();\n}\nfunction drawGiant(c){\n  const x=giant.x, y=giant.y, r=giant.r;\n  c.save(); c.translate(x,y);\n  const g=c.createRadialGradient(0,0,r*.4,0,0,r*2.1);\n  g.addColorStop(0,'rgba(255,150,40,.30)'); g.addColorStop(1,'rgba(255,150,40,0)');\n  c.fillStyle=g; c.beginPath(); c.arc(0,0,r*2.1,0,Math.PI*2); c.fill();\n  c.fillStyle='#e07b00'; c.beginPath(); c.ellipse(0,0,r,r*.88,0,0,Math.PI*2); c.fill();\n  c.strokeStyle='rgba(120,50,0,.7)'; c.lineWidth=3;\n  c.beginPath(); c.ellipse(0,0,r*.62,r*.88,0,0,Math.PI*2); c.stroke();\n  c.fillStyle='#3d6b1e'; roundRect(c,-6,-r-16,12,18,4); c.fill();\n  c.fillStyle='#ffd76a'; c.shadowColor='#ffb300'; c.shadowBlur=18;\n  c.beginPath(); c.moveTo(-r*.3,-r*.34); c.lineTo(-r*.12,-r*.1); c.lineTo(-r*.44,-r*.1); c.closePath(); c.fill();\n  c.beginPath(); c.moveTo(r*.3,-r*.34); c.lineTo(r*.12,-r*.1); c.lineTo(r*.44,-r*.1); c.closePath(); c.fill();\n  c.beginPath(); c.moveTo(-r*.42,r*.28); c.quadraticCurveTo(0,r*.62,r*.42,r*.28);\n  c.lineTo(r*.28,r*.42); c.lineTo(0,r*.42); c.lineTo(-r*.28,r*.42); c.closePath(); c.fill();\n  c.shadowBlur=0;\n  for(let i=0;i<5;i++){ c.fillStyle = i<giant.candy ? '#ff5d8f' : 'rgba(255,255,255,.15)'; c.beginPath(); c.arc(-r*.3+i*r*.15, r*.78, 7, 0, Math.PI*2); c.fill(); }\n  c.restore();\n}\nfunction drawCannon(c){\n  c.save(); c.translate(cannon.x,cannon.y);\n  c.fillStyle='#3a2a1a'; roundRect(c,-34,-58,68,58,10); c.fill();\n  c.strokeStyle='#ff9800'; c.lineWidth=2.5; c.stroke();\n  c.save(); c.rotate(-cannon.recoil*.12);\n  c.fillStyle='#5a4026'; roundRect(c,-9,-92,18,44,7); c.fill();\n  drawPumpkin(c,0,-98,15);\n  if(target.active){ c.fillStyle='#fff'; c.font='bold 13px sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(target.table),0,-98); }\n  c.restore(); c.restore();\n}\nfunction drawDeco(c,d){\n  c.save(); c.translate(d.x,d.y); c.rotate(Math.sin(d.rot)*.06); c.scale(d.s,d.s);\n  if(d.kind==='mushroom'){\n    c.fillStyle='#e8dff5'; roundRect(c,-4,-12,8,14,3); c.fill();\n    c.fillStyle='#e04545'; c.beginPath(); c.arc(0,-12,11,Math.PI,0); c.closePath(); c.fill();\n    c.fillStyle='#fff'; c.beginPath(); c.arc(-5,-16,2.2,0,Math.PI*2); c.arc(4,-18,1.8,0,Math.PI*2); c.fill();\n  } else if(d.kind==='tree'){\n    c.strokeStyle='#241533'; c.lineWidth=7; c.lineCap='round';\n    c.beginPath(); c.moveTo(0,0); c.lineTo(0,-40); c.stroke();\n    c.lineWidth=4;\n    c.beginPath(); c.moveTo(0,-26); c.lineTo(-16,-46); c.stroke();\n    c.beginPath(); c.moveTo(0,-32); c.lineTo(16,-52); c.stroke();\n  } else {\n    drawPumpkin(c,0,0,15);\n    c.fillStyle='#2b1500';\n    c.beginPath(); c.moveTo(-7,-4); c.lineTo(-2,2); c.lineTo(-9,2); c.closePath(); c.fill();\n    c.beginPath(); c.moveTo(7,-4); c.lineTo(2,2); c.lineTo(9,2); c.closePath(); c.fill();\n    c.beginPath(); c.moveTo(-7,7); c.quadraticCurveTo(0,12,7,7); c.lineTo(4,9.5); c.lineTo(0,7.6); c.lineTo(-4,9.5); c.closePath(); c.fill();\n  }\n  c.restore();\n}\nfunction drawCat(c){\n  const x=W-92, y=H-104;\n  let ox = cat.mode==='steal' ? -Math.sin(Math.min(1,cat.t/1.4)*Math.PI)*80 : (cat.mode==='happy'? Math.sin(cat.t*12)*3 : 0);\n  c.save(); c.translate(x+ox,y);\n  c.fillStyle='#17121f';\n  c.beginPath(); c.ellipse(0,10,23,20,0,0,Math.PI*2); c.fill();\n  c.beginPath(); c.arc(0,-14,15,0,Math.PI*2); c.fill();\n  c.beginPath(); c.moveTo(-11,-22); c.lineTo(-13,-37); c.lineTo(-3,-27); c.closePath(); c.fill();\n  c.beginPath(); c.moveTo(11,-22); c.lineTo(13,-37); c.lineTo(3,-27); c.closePath(); c.fill();\n  c.strokeStyle='#17121f'; c.lineWidth=5; c.lineCap='round';\n  c.beginPath(); c.moveTo(16,16); c.quadraticCurveTo(36,10,32,-10+Math.sin(elapsed*3)*5); c.stroke();\n  c.fillStyle = cat.mode==='happy' ? '#ffd34d' : (cat.mode==='steal' ? '#ffe066' : '#7dff8a');\n  c.beginPath(); c.arc(-5,-16,2.6,0,Math.PI*2); c.arc(5,-16,2.6,0,Math.PI*2); c.fill();\n  c.restore();\n}\nfunction render(){\n  const t=performance.now()/1000;\n  const sky=ctx.createLinearGradient(0,0,0,H);\n  sky.addColorStop(0,'#1a0d38'); sky.addColorStop(1,'#0b0714');\n  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);\n  for(const s of stars){ if(s.x>W+10) continue; ctx.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.5+s.tw)); ctx.fillStyle='#fff'; ctx.fillRect(s.x,s.y*H,s.r,s.r); }\n  ctx.globalAlpha=1;\n  ctx.fillStyle='#f5e9c8'; ctx.beginPath(); ctx.arc(W-170,110,56,0,Math.PI*2); ctx.fill();\n  ctx.fillStyle='#0e0820'; ctx.fillRect(90,H*0.52,150,120);\n  ctx.beginPath(); ctx.moveTo(70,H*0.52); ctx.lineTo(165,H*0.40); ctx.lineTo(260,H*0.52); ctx.closePath(); ctx.fill();\n  ctx.fillStyle='rgba(255,190,80,.85)'; ctx.fillRect(115,H*0.62,22,26); ctx.fillRect(190,H*0.62,22,26);\n  ctx.fillStyle='#160d26'; ctx.fillRect(0,H*0.72,W,H*0.28);\n  for(const d of deco) drawDeco(ctx,d);\n  drawTarget(ctx);\n  for(const p of puffs){ ctx.globalAlpha=Math.max(0,1-p.t/p.life); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,4*(1-p.t/p.life)+1,0,Math.PI*2); ctx.fill(); }\n  ctx.globalAlpha=1;\n  for(const fl of flights){ const k=fl.t/fl.life; const x=fl.x+(giant.x-fl.x)*k, y=fl.y+(giant.y-fl.y)*k-Math.sin(k*Math.PI)*90; ctx.fillStyle='#ff5d8f'; ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2); ctx.fill(); }\n  for(const p of boomPuffs){ ctx.globalAlpha=Math.max(0,1-p.t/p.life); ctx.fillStyle='#ffb347'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }\n  ctx.globalAlpha=1;\n  for(const g of partyGhosts){ ctx.save(); ctx.globalAlpha=.85; ctx.fillStyle='#e8e4ff'; ctx.beginPath(); ctx.arc(g.x,g.y+Math.sin(g.bob)*10,18,0,Math.PI*2); ctx.fill(); ctx.restore(); }\n  drawCannon(ctx);\n  if(giant.exploding<=0) drawGiant(ctx);\n  drawCat(ctx);\n  for(const f of fogBlobs){ const g=ctx.createRadialGradient(f.x,f.y,10,f.x,f.y,f.r); g.addColorStop(0,'rgba(160,140,220,.07)'); g.addColorStop(1,'rgba(160,140,220,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); }\n}\nlet last=performance.now();\nfunction frame(now){\n  const dt=Math.min(.05,(now-last)/1000); last=now;\n  try{ update(dt); render(); }catch(e){ console.error(e); }\n  requestAnimationFrame(frame);\n}\napplyLang();\nrequestAnimationFrame(frame);\n</script>\n</body>\n</html>
